<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff8e7; --paper2: #f5e6c8; --ink: #2b2b3a; --soft: #6b6577; --accent: #d65434;
    --blue: #5b7bd5; --card: #ffffff; --line: #e8dcc0; --ok: #3d9a5b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #1d1b22; --paper2: #26232d; --ink: #f2eee6; --soft: #b5aec2;
      --card: #2c2934; --line: #3b3745; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: linear-gradient(var(--paper), var(--paper2));
    color: var(--ink); font: 17px/1.45 "Baloo 2", system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 30px; margin: 4px 0 2px; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .sub { color: var(--soft); margin: 0 0 18px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px; margin: 14px 0; }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px;
    border: 0; border-radius: 18px; background: var(--accent); color: #fff; font: 700 21px "Baloo 2", system-ui;
    cursor: pointer; box-shadow: 0 4px 0 #a63c22; }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #a63c22; }
  .big.secondary { background: var(--blue); box-shadow: 0 4px 0 #3f5cae; }
  .big[disabled] { opacity: .5; }
  ul.tips { margin: 6px 0 0; padding-left: 20px; color: var(--soft); }
  .hidden { display: none !important; }
  .spinner { width: 54px; height: 54px; border: 6px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite; margin: 18px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas#preview { width: 100%; aspect-ratio: 1; display: block; border-radius: 16px;
    background: repeating-linear-gradient(0deg, transparent 0 31px, var(--line) 31px 32px); }
  .desc { font-style: italic; color: var(--soft); margin: 8px 2px 0; }
  label { display: block; font-weight: 700; margin: 6px 0; }
  input[type=text] { width: 100%; font: 22px "Baloo 2", system-ui; padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
  details summary { cursor: pointer; font-weight: 700; color: var(--blue); }
  .editor { position: relative; margin-top: 10px; touch-action: none; user-select: none; }
  .editor img { width: 100%; display: block; border-radius: 12px; background: #fff; }
  .dot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 1px 4px #0006; touch-action: none; }
  .dot.r { background: #d63c3c; } .dot.l { background: #3c5fd6; } .dot.c { background: #333; }
  .legend { font-size: 14px; color: var(--soft); }
  .error { color: var(--accent); font-weight: 700; }
  .done { text-align: center; }
  .done .tick { font-size: 64px; color: var(--ok); line-height: 1; }
  .meta { font-size: 13px; color: var(--soft); text-align: right; }
</style>
</head>
<body>
<main>
  <h1>Doodle <span>Theater</span></h1>
  <p class="sub" id="sub">Add a star to tonight's show.</p>

  <section id="s-start" class="card">
    <button class="big" id="pick">📷 Photograph the drawing</button>
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <ul class="tips">
      <li>One character, plain white paper</li>
      <li>Arms out, legs apart</li>
      <li>Straight from above, good light</li>
    </ul>
    <p class="error hidden" id="err"></p>
  </section>

  <section id="s-work" class="card hidden">
    <div class="spinner"></div>
    <p style="text-align:center" id="work-msg">Cutting out the drawing…</p>
  </section>

  <section id="s-check" class="hidden">
    <div class="card">
      <canvas id="preview"></canvas>
      <p class="desc" id="desc"></p>
      <p class="meta" id="meta"></p>
    </div>
    <div class="card">
      <details id="fix">
        <summary>Moves look odd? Fix the joints</summary>
        <p class="legend">Drag the dots: <b style="color:#d63c3c">red</b> is the character's right side, <b style="color:#3c5fd6">blue</b> their left.</p>
        <div class="editor" id="editor"><img id="tex" alt="the drawing"></div>
      </details>
    </div>
    <div class="card">
      <label for="name">What's their name?</label>
      <input id="name" type="text" maxlength="24" placeholder="Captain Blob" autocomplete="off">
      <div style="height:14px"></div>
      <button class="big" id="send">✨ Send to the TV</button>
    </div>
  </section>

  <section id="s-done" class="card done hidden">
    <div class="tick">✓</div>
    <h2 id="done-msg">On the TV now!</h2>
    <button class="big secondary" id="again">Add another star</button>
  </section>
</main>

<script type="module">
import { prepareRig, Stage } from "/static/vendor/doodlerig.js";

const CODE = "__CODE__";
const $ = (id) => document.getElementById(id);
const show = (id) => ["s-start", "s-work", "s-check", "s-done"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
let draft = null, stage = null, actor = null, motions = null, busy = false;

if (!CODE) {
  $("sub").textContent = "This link has expired. Choose “Add a star” on the TV and scan the new code.";
  $("pick").disabled = true;
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Something went wrong (${r.status})`);
  return body;
}

async function loadPreview() {
  motions ??= (await api("/motions.json")).motions;
  const bust = `?v=${Date.now()}`;
  const json = await api(`/rigs/${draft.id}/rig.json${bust}`);
  const img = new Image();
  img.src = `/rigs/${draft.id}/texture.png${bust}`;
  await img.decode();
  if (!stage) { stage = new Stage($("preview"), motions); stage.run(); }
  stage.actors.length = 0;
  actor = stage.add(prepareRig(json, img), { x: 0.5, scale: 0.78, motion: "dance" });
  $("tex").src = img.src;
}

const ORDER = ["neck", "torso", "root", "right_shoulder", "right_elbow", "right_hand", "left_shoulder",
  "left_elbow", "left_hand", "right_hip", "right_knee", "right_foot", "left_hip", "left_knee", "left_foot"];

function placeDots() {
  const ed = $("editor");
  ed.querySelectorAll(".dot").forEach((d) => d.remove());
  for (const name of ORDER) {
    const [x, y] = draft.joints[name];
    const d = document.createElement("div");
    d.className = "dot " + (name.startsWith("right") ? "r" : name.startsWith("left") ? "l" : "c");
    d.style.left = `${(x / draft.width) * 100}%`;
    d.style.top = `${(y / draft.height) * 100}%`;
    d.title = name.replace("_", " ");
    d.onpointerdown = (e) => {
      d.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const r = ed.getBoundingClientRect();
        const fx = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
        const fy = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
        d.style.left = `${fx * 100}%`; d.style.top = `${fy * 100}%`;
        draft.joints[name] = [fx * draft.width, fy * draft.height];
      };
      const up = async () => {
        d.removeEventListener("pointermove", move);
        d.removeEventListener("pointerup", up);
        await saveJoints();
      };
      d.addEventListener("pointermove", move);
      d.addEventListener("pointerup", up);
    };
    ed.append(d);
  }
}

async function saveJoints() {
  if (busy) return;
  busy = true;
  try {
    const joints = { ...draft.joints, hip: draft.joints.root };
    draft = await api(`/api/p/${CODE}/draft/${draft.id}/joints`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ joints }),
    });
    await loadPreview();
    placeDots();
  } catch (e) { alert(e.message); } finally { busy = false; }
}

$("pick").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  $("err").classList.add("hidden");
  show("s-work");
  const msgs = ["Cutting out the drawing…", "Finding elbows and knees…", "Teaching it to dance…"];
  let i = 0;
  const tick = setInterval(() => ($("work-msg").textContent = msgs[++i % msgs.length]), 1600);
  try {
    const form = new FormData();
    form.append("file", f);
    draft = await api(`/api/p/${CODE}/photo`, { method: "POST", body: form });
    await loadPreview();
    placeDots();
    $("desc").textContent = draft.description;
    $("meta").textContent = `ready in ${draft.seconds}s · joints by ${draft.joints_from}`;
    show("s-check");
    $("name").focus();
  } catch (e) {
    $("err").textContent = e.message;
    $("err").classList.remove("hidden");
    show("s-start");
  } finally { clearInterval(tick); $("file").value = ""; }
};

$("send").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("name").focus(); return; }
  $("send").disabled = true;
  try {
    await api(`/api/p/${CODE}/draft/${draft.id}/send`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
    });
    $("done-msg").textContent = `${name} is on the TV now!`;
    show("s-done");
  } catch (e) { alert(e.message); } finally { $("send").disabled = false; }
};

$("again").onclick = () => { $("name").value = ""; draft = null; show("s-start"); };
</script>
</body>
</html>
